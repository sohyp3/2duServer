# Include from Nginx's http context (e.g. sites-enabled or conf.d).
# Replace sync.example.com and the certificate paths with your own.
limit_req_zone $binary_remote_addr zone=twodu_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=twodu_connections:1m;

server {
    listen 80;
    server_name sync.example.com;
    return 301 https://sync.example.com$request_uri;
}

server {
    listen 443 ssl;
    server_name sync.example.com;

    ssl_certificate /etc/letsencrypt/live/sync.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sync.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;

    client_max_body_size 5000000;
    client_header_timeout 15s;
    client_body_timeout 30s;
    limit_req zone=twodu_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn twodu_connections 10;
    limit_conn_status 429;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
