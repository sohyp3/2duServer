# Install as /etc/nginx/sites-available/2du.hyp3.cafe and link it into sites-enabled.
# HTTP only on purpose: `certbot --nginx -d 2du.hyp3.cafe` adds the 443 block, the
# certificate paths and the http→https redirect to this file, and renews them in place.
# The API is served at the root (https://2du.hyp3.cafe/v1/..., used by the app)
# and under /api (https://2du.hyp3.cafe/api/v1/...). Everything else is the web app.
limit_req_zone $binary_remote_addr zone=twodu_requests:1m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=twodu_connections:1m;

upstream twodu_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

server {
    server_name 2du.hyp3.cafe;

    # Matches the server's 5,000,000-byte sync limit.
    client_max_body_size 5000000;
    client_header_timeout 15s;
    client_body_timeout 30s;
    limit_req zone=twodu_requests burst=20 nodelay;
    limit_req_status 429;
    limit_conn twodu_connections 10;
    limit_conn_status 429;

    location = /api {
        return 301 /api/;
    }

    # Trailing slash on proxy_pass strips the /api prefix before the app sees it.
    location /api/ {
        proxy_pass http://twodu_app/;
        proxy_http_version 1.1;
        # Empty Connection header keeps the upstream keepalive pool working.
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # The app only accepts a bare origin (https://2du.hyp3.cafe), so also serve the
    # API at the root, unprefixed. No URI on proxy_pass: the path is passed unchanged.
    location ~ ^/(?:v1/|health$) {
        proxy_pass http://twodu_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_request_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Web app: static Expo export (`bun run build:web` in the 2du repo), synced to
    # /root/apps/2du-web. expo-sqlite on web needs cross-origin isolation (COOP/COEP),
    # so every web response carries both headers. add_header is not inherited by
    # locations that set their own, hence the repetition.
    location /_expo/static/ {
        root /root/apps/2du-web;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip on;
        gzip_types application/javascript text/css;
        try_files $uri =404;
    }

    location /assets/ {
        root /root/apps/2du-web;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "public, max-age=2592000" always;
        gzip on;
        gzip_types application/wasm application/json image/svg+xml;
        try_files $uri =404;
    }

    # Dynamic routes are exported as literal [id].html files.
    location ~ ^/(note|todo)/[^/]+$ {
        root /root/apps/2du-web;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
        try_files /$1/[id].html =404;
    }

    # Public booking pages are rendered by the API server, not the static web app.
    location /book/ {
        proxy_pass http://twodu_app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location / {
        root /root/apps/2du-web;
        index index.html;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Cross-Origin-Embedder-Policy require-corp always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri.html $uri/ =404;
        error_page 404 /+not-found.html;
    }
}
